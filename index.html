
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiddo</title>
  <meta name="description" content="A vibrant, keyboard-driven learning app for kids to explore letters and numbers through visual associations and audio pronunciations.">
  <meta property="og:title" content="Kiddo">
  <meta property="og:description" content="A vibrant, keyboard-driven learning app for kids to explore letters and numbers through visual associations and audio pronunciations.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== Kiddo Crayon-Box Palette ===== */
    /* Bright, fully-saturated colors that delight 5-year-olds */
    :root {
      --k-red:    hsl(5,  95%, 56%);   /* tomato red     */
      --k-orange: hsl(28, 100%, 55%);  /* crayon orange  */
      --k-yellow: hsl(45, 100%, 52%);  /* sunny yellow   */
      --k-green:  hsl(140, 70%, 42%);  /* grassy green   */
      --k-teal:   hsl(174, 80%, 40%);  /* fresh teal     */
      --k-blue:   hsl(205, 90%, 50%);  /* sky blue       */
      --k-indigo: hsl(228, 85%, 58%);  /* royal indigo   */
      --k-purple: hsl(265, 80%, 55%);  /* grape purple   */
      --k-pink:   hsl(330, 90%, 62%);  /* bubblegum pink */
      --k-rose:   hsl(350, 95%, 65%);  /* candy rose     */
      --k-bg:     hsl(50, 60%, 96%);   /* warm paper bg  */
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--k-bg);
      overflow-x: hidden;
    }

    .bg-k-red    { background-color: var(--k-red);    }
    .bg-k-orange { background-color: var(--k-orange); }
    .bg-k-yellow { background-color: var(--k-yellow); }
    .bg-k-green  { background-color: var(--k-green);  }
    .bg-k-teal   { background-color: var(--k-teal);   }
    .bg-k-blue   { background-color: var(--k-blue);   }
    .bg-k-indigo { background-color: var(--k-indigo); }
    .bg-k-purple { background-color: var(--k-purple); }
    .bg-k-pink   { background-color: var(--k-pink);   }
    .bg-k-rose   { background-color: var(--k-rose);   }

    .perspective-1000 { perspective: 1000px; }

    /* TV-friendly: slightly larger base scaling */
    @media (min-width: 1600px) {
      html { font-size: 20px; }
    }
    @media (min-width: 1920px) {
      html { font-size: 22px; }
    }
  </style>
<script type="importmap">

}

</head>

</body>
</html>
